<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytical Reports | COVID Vaccination MS</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="loading">

<!-- Mobile overlay -->
<div class="overlay" id="overlay" onclick="closeSidebar()"></div>

<!-- Sidebar -->
<aside class="sidebar" id="sidebar"></aside>

<!-- Main area -->
<div class="main-area">
    <header class="topbar">
        <div style="display:flex;align-items:center;gap:14px;">
            <button class="hamburger" onclick="openSidebar()"><i class="fa-solid fa-bars"></i></button>
            <span class="page-title">Analytical Reports</span>
        </div>
        <div class="topbar-right">
            <span class="topbar-time" id="clock"></span>
        </div>
    </header>

    <div class="content">

<div class="page-header" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;">
    <div>
        <h1><i class="fa-solid fa-chart-column" style="color:var(--primary);margin-right:8px"></i>DBMS Analytical Reports</h1>
        <p>Pre-compiled SQL queries demonstrating relational joins, aggregation, grouping, views, and subqueries.</p>
    </div>
    <button class="btn btn-ghost btn-sm" onclick="window.print()">
        <i class="fa-solid fa-print"></i> Print Reports
    </button>
</div>

<div id="reports"></div>

    </div><!-- .content -->
    <footer class="footer">
        DBMS Project &middot; COVID Vaccination Management System &middot; Node.js + MySQL 8.0
    </footer>
</div><!-- .main-area -->

<script src="js/main.js"></script>
<script src="js/reports.js"></script>
</body>
</html>
