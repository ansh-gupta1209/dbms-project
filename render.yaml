# Render Blueprint: Node.js / Express API (the HTML/CSS/JS frontend is hosted on Vercel)
services:
  - type: web
    name: covid-vaccination-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false          # paste the Aiven MySQL Service URI when prompted
      - key: SESSION_SECRET
        generateValue: true
